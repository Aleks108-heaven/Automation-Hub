# Automation Hub pipeline.
#   verify  fast checks that the generated files match their sources
#   test    browser smoke test of the built hub and the component gallery
#   deploy  publish the hub and the design-system gallery to GitLab Pages (default branch only)

stages: [verify, test, deploy]

default:
  image: node:22-bookworm
  interruptible: true

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH

variables:
  npm_config_cache: "$CI_PROJECT_DIR/.npm"
  PLAYWRIGHT_BROWSERS_PATH: "$CI_PROJECT_DIR/.cache/ms-playwright"

.node_cache: &node_cache
  cache:
    key:
      files: [package-lock.json]
    paths: [.npm/, .cache/ms-playwright/]

tokens:
  stage: verify
  script:
    # tokens.css, the hub's token block and the gallery must be regenerated from tokens.json
    - node tools/build-tokens.js --check

translations:
  stage: verify
  script:
    # every translation must match the English structure
    - node tools/check-i18n.js 1-learning-hub/source

hub-build:
  stage: verify
  script:
    # the committed single-file hub must equal a fresh build of the sources
    - (cd 1-learning-hub/source && sh build.sh)   # build.sh must run from its own folder
    - git diff --exit-code -- 1-learning-hub/automation-hub.html
      || (echo "automation-hub.html is stale. Run 'cd 1-learning-hub/source && sh build.sh' and commit the result." && exit 1)

e2e:
  stage: test
  <<: *node_cache
  needs: [tokens, translations, hub-build]
  script:
    - npm ci
    - npx playwright install --with-deps chromium
    - npm run test:e2e

pages:
  stage: deploy
  needs: [e2e]
  script:
    - mkdir -p public/design-system
    - cp 1-learning-hub/automation-hub.html public/index.html
    - cp 2-design-system/components-gallery.html public/design-system/index.html
  artifacts:
    paths: [public]
    expire_in: 30 days
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
