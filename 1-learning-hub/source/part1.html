<title>Automation Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:ital,wght@0,400;0,600;1,400&display=swap">
<style>
:root{
  --surface-000:#ffffff;--surface-100:#f5f4ef;--surface-200:#ebe9e1;--line:#d9d6cb;--line-strong:#86826f;
  --ink:#1b1d21;--ink-muted:#55585f;--brand:#1d5c4f;--brand-strong:#133f36;--brand-soft:#dcebe5;--on-brand:#ffffff;
  --accent:#d9a21b;--accent-ink:#7a5600;--accent-soft:#f6ecce;
  --pass:#0b6a78;--pass-soft:#d7eef1;--fail:#b3410e;--fail-soft:#f8e2d6;--flaky:#7d5a00;--flaky-soft:#f3ead0;--skip:#5d6068;
  --code-bg:#1b1d21;--code-ink:#e9e6de;--code-muted:#9ba1aa;--code-key:#83d3c3;--code-str:#f0c36a;
  --shadow-raised:0 1px 2px rgba(27,29,33,.06),0 4px 12px rgba(27,29,33,.05);
  --space-1:4px;--space-2:8px;--space-3:12px;--space-4:16px;--space-6:24px;--space-8:32px;--space-12:48px;
  --radius-sm:4px;--radius-md:8px;--radius-lg:14px;--radius-pill:999px;
  --font-sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;
  --surface-000:#1f2227;--surface-100:#15171b;--surface-200:#262a30;--line:#343840;--line-strong:#7a808b;
  --ink:#ece9e1;--ink-muted:#a9acb3;--brand:#7cc6b0;--brand-strong:#a6dccb;--brand-soft:#1d3831;--on-brand:#0e1a17;
  --accent:#e3b544;--accent-ink:#e3b544;--accent-soft:#352d15;
  --pass:#6cc5d1;--pass-soft:#15343a;--fail:#f2905f;--fail-soft:#3b2118;--flaky:#e7c15a;--flaky-soft:#342c12;--skip:#a2a6ae;
  --code-bg:#0d0f12;--shadow-raised:0 1px 2px rgba(0,0,0,.4);}}
:root[data-theme="dark"]{color-scheme:dark;
  --surface-000:#1f2227;--surface-100:#15171b;--surface-200:#262a30;--line:#343840;--line-strong:#7a808b;
  --ink:#ece9e1;--ink-muted:#a9acb3;--brand:#7cc6b0;--brand-strong:#a6dccb;--brand-soft:#1d3831;--on-brand:#0e1a17;
  --accent:#e3b544;--accent-ink:#e3b544;--accent-soft:#352d15;
  --pass:#6cc5d1;--pass-soft:#15343a;--fail:#f2905f;--fail-soft:#3b2118;--flaky:#e7c15a;--flaky-soft:#342c12;--skip:#a2a6ae;
  --code-bg:#0d0f12;--shadow-raised:0 1px 2px rgba(0,0,0,.4);}

*{box-sizing:border-box}
html,body{background:var(--surface-100)}
body{font-family:var(--font-sans);color:var(--ink);font-size:16px;line-height:26px;-webkit-font-smoothing:antialiased}
a{color:var(--brand)} a:hover{color:var(--brand-strong)}
h1,h2,h3{text-wrap:balance;margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:var(--radius-sm)}
.label{font:600 12px/16px var(--font-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-muted)}
.mono{font-family:var(--font-mono)}
.tnum{font-variant-numeric:tabular-nums}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:272px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:env(safe-area-inset-top,0px);height:100vh;overflow-y:auto;background:var(--surface-200);border-right:1px solid var(--line);padding:var(--space-6) var(--space-4);display:flex;flex-direction:column;gap:var(--space-6)}
.brandmark{display:flex;align-items:center;gap:var(--space-3);text-decoration:none;color:var(--ink)}
.brandmark__glyph{display:grid;grid-template-columns:repeat(3,6px);gap:3px}
.brandmark__glyph i{height:6px;border-radius:2px;background:var(--brand)} .brandmark__glyph i.f{background:var(--accent)}
.brandmark b{font-weight:600;font-size:17px;letter-spacing:-.01em}
.side__progress{display:flex;flex-direction:column;gap:var(--space-2)}
.side__progress .row{display:flex;justify-content:space-between;align-items:baseline}
.bar{height:8px;background:var(--surface-000);border-radius:var(--radius-pill);overflow:hidden;border:1px solid var(--line)}
.bar>span{display:block;height:100%;background:var(--accent);border-radius:var(--radius-pill);transition:width .3s}
.search{width:100%;font:14px/20px var(--font-sans);padding:var(--space-2) var(--space-3);border:1px solid var(--line-strong);border-radius:var(--radius-md);background:var(--surface-000);color:var(--ink)}
.lang{display:flex;flex-direction:column;gap:6px;margin-bottom:var(--space-3)}.lang select{width:100%;font:14px/20px var(--font-sans);padding:var(--space-2) var(--space-3);border:1px solid var(--line-strong);border-radius:var(--radius-md);background:var(--surface-000);color:var(--ink)}
.search::placeholder{color:var(--ink-muted)}
nav.toc{display:flex;flex-direction:column;gap:var(--space-4)}
.toc__group{display:flex;flex-direction:column;gap:2px}
.toc__group .label{padding:0 var(--space-2) var(--space-1)}
.toc a{display:flex;gap:var(--space-2);align-items:baseline;padding:6px var(--space-2);border-radius:var(--radius-md);text-decoration:none;color:var(--ink);font-size:14px;line-height:20px}
.toc a:hover{background:var(--surface-000)}
.toc a[aria-current="page"]{background:var(--brand-soft);color:var(--brand);font-weight:600}
.toc a .n{font:500 12px/20px var(--font-mono);color:var(--ink-muted);min-width:20px}
.toc a[aria-current="page"] .n{color:var(--brand)}
.toc a .t{flex:1}
.toc a .d{font:600 12px/20px var(--font-mono);color:var(--pass)}
.side__foot{margin-top:auto;display:flex;gap:var(--space-2);flex-wrap:wrap}

.topbar{display:none}
main:focus{outline:none}
main{min-width:0;padding-inline:var(--space-8);padding-block:var(--space-12)}
.wrap{max-width:820px;margin:0 auto;display:flex;flex-direction:column;gap:var(--space-8)}
.prose{max-width:720px}

/* ---------- components (from the Automation Hub design system) ---------- */
.btn{display:inline-flex;align-items:center;gap:var(--space-2);font:600 14px/20px var(--font-sans);padding:var(--space-2) var(--space-4);min-height:40px;border-radius:var(--radius-md);border:1px solid transparent;cursor:pointer;text-decoration:none;background:none}
.btn--primary{background:var(--brand);color:var(--on-brand)} .btn--primary:hover{background:var(--brand-strong);color:var(--on-brand)}
.btn--secondary{background:var(--surface-000);color:var(--ink);border-color:var(--line-strong)} .btn--secondary:hover{background:var(--surface-200);color:var(--ink)}
.btn--ghost{color:var(--brand)} .btn--ghost:hover{background:var(--brand-soft)}
.btn--sm{min-height:32px;padding:var(--space-1) var(--space-3);font-size:13px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.badge{display:inline-flex;align-items:center;gap:var(--space-1);font:600 12px/16px var(--font-mono);letter-spacing:.02em;padding:var(--space-1) var(--space-2);border-radius:var(--radius-sm);background:var(--surface-200);color:var(--ink-muted);white-space:nowrap}
.badge--pass{background:var(--pass-soft);color:var(--pass)} .badge--fail{background:var(--fail-soft);color:var(--fail)}
.badge--flaky{background:var(--flaky-soft);color:var(--flaky)} .badge--brand{background:var(--brand-soft);color:var(--brand)}
.card{display:flex;flex-direction:column;gap:var(--space-2);background:var(--surface-000);border:1px solid var(--line);border-radius:var(--radius-lg);padding:var(--space-6);color:inherit;text-decoration:none;transition:box-shadow .15s,border-color .15s}
a.card:hover{box-shadow:var(--shadow-raised);border-color:var(--line-strong);color:inherit}
.card__eyebrow{font:600 12px/16px var(--font-mono);letter-spacing:.04em;color:var(--ink-muted)}
.card__title{font-size:18px;line-height:24px;font-weight:600}
.card__body{font-size:14px;line-height:22px;color:var(--ink-muted);margin:0}
.card__foot{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:var(--space-2);margin-top:auto;padding-top:var(--space-2)}
.card__foot .badge{white-space:normal;min-width:0}
.callout{border-radius:var(--radius-md);padding:var(--space-4);background:var(--surface-200);font-size:15px;line-height:24px}
.callout__label{display:block;font:600 12px/16px var(--font-mono);letter-spacing:.04em;text-transform:uppercase;margin-bottom:var(--space-1)}
.callout p{margin:0}
.callout--tip{background:var(--accent-soft)} .callout--tip .callout__label{color:var(--accent-ink)}
.callout--risk{background:var(--fail-soft)} .callout--risk .callout__label{color:var(--fail)}
.callout--note{background:var(--brand-soft)} .callout--note .callout__label{color:var(--brand)}
pre.code{background:var(--code-bg);color:var(--code-ink);font:400 13.5px/22px var(--font-mono);border-radius:var(--radius-md);padding:var(--space-4);overflow-x:auto;margin:0;white-space:pre}
pre.code .c{color:var(--code-muted)} pre.code .k{color:var(--code-key)} pre.code .s{color:var(--code-str)}
code.i{font:400 .875em/1 var(--font-mono);background:var(--surface-200);padding:2px 5px;border-radius:var(--radius-sm)}
details.faq{border:1px solid var(--line);border-radius:var(--radius-md);background:var(--surface-000)}
details.faq+details.faq{margin-top:6px}
details.faq summary{cursor:pointer;padding:var(--space-3) var(--space-4);font-weight:600;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:var(--space-3)}
details.faq summary::-webkit-details-marker{display:none}
details.faq summary::after{content:'+';color:var(--ink-muted);font-weight:400;font-size:18px}
details.faq[open] summary::after{content:'–'}
details.faq[open] summary{border-bottom:1px solid var(--line)}
details.faq .faq__a{margin:0;padding:var(--space-3) var(--space-4) var(--space-4);color:var(--ink-muted);font-size:14px;line-height:22px}
.faq-group{display:flex;flex-direction:column;gap:0}
.checklist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.check{display:flex;gap:var(--space-3);align-items:flex-start;padding:var(--space-2) var(--space-3);border-radius:var(--radius-md);cursor:pointer;font-size:15px;line-height:24px}
.check:hover{background:var(--surface-200)}
.check input{appearance:none;-webkit-appearance:none;flex:none;width:18px;height:18px;margin:3px 0 0;border:1.5px solid var(--line-strong);border-radius:var(--radius-sm);background:var(--surface-000);display:grid;place-content:center;cursor:pointer}
.check input:checked{background:var(--brand);border-color:var(--brand)}
.check input:checked::after{content:"";width:9px;height:5px;border:2px solid var(--on-brand);border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
.check input:checked + span{color:var(--ink-muted);text-decoration:line-through}

/* ---------- content ---------- */
.hero{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:var(--space-8);align-items:end}
.hero h1{font-size:52px;line-height:56px;letter-spacing:-.02em;font-weight:600}
.hero p.lede{font-size:18px;line-height:28px;color:var(--ink-muted);margin:var(--space-4) 0 0;max-width:560px}
.runlog{background:var(--code-bg);border-radius:var(--radius-lg);padding:var(--space-4);font:400 12.5px/20px var(--font-mono);color:var(--code-ink)}
.runlog .row{display:flex;gap:var(--space-2);white-space:nowrap;overflow:hidden}
.runlog .ok{color:var(--code-key)} .runlog .fl{color:var(--code-str)} .runlog .mu{color:var(--code-muted)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--space-4)}
.stat{background:var(--surface-000);border:1px solid var(--line);border-radius:var(--radius-lg);padding:var(--space-4) var(--space-6)}
.stat b{display:block;font:500 28px/32px var(--font-mono);font-variant-numeric:tabular-nums}
.stat span{font-size:14px;color:var(--ink-muted)}
.track{display:flex;flex-direction:column;gap:var(--space-4)}
.track__head{display:flex;justify-content:space-between;align-items:baseline;gap:var(--space-4);flex-wrap:wrap}
.track__head h2{font-size:24px;line-height:30px}
.track__head p{margin:0;color:var(--ink-muted);font-size:15px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:var(--space-4)}
.practice{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:var(--space-4)}

.mod-head{display:flex;flex-direction:column;gap:var(--space-3)}
.mod-head h1{font-size:40px;line-height:46px;letter-spacing:-.015em}
.mod-head .meta{display:flex;gap:var(--space-2);flex-wrap:wrap;align-items:center}
.mod-head .sum{font-size:18px;line-height:28px;color:var(--ink-muted);margin:0;max-width:680px}
.sec{display:flex;flex-direction:column;gap:var(--space-4)}
.sec h2{font-size:24px;line-height:30px;padding-top:var(--space-2)}
.sec h3{font-size:18px;line-height:24px}
.sec p{margin:0;max-width:700px}
.sec ul,.sec ol{margin:0;padding-left:22px;max-width:700px;display:flex;flex-direction:column;gap:6px}
.sec li::marker{color:var(--ink-muted)}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius-md);background:var(--surface-000)}
.tbl table{border-collapse:collapse;width:100%;font-size:14px;line-height:21px;min-width:520px}
.tbl th{background:var(--surface-200);text-align:left;font-weight:600;padding:var(--space-2) var(--space-3);border-bottom:1px solid var(--line);vertical-align:bottom}
.tbl td{padding:var(--space-2) var(--space-3);border-top:1px solid var(--line);vertical-align:top}
.tbl tr:first-child td{border-top:0}
.tbl td:first-child{font-weight:600}
.layers{display:flex;flex-direction:column;gap:6px;max-width:520px}
.layers div{display:flex;justify-content:space-between;gap:var(--space-4);padding:var(--space-3) var(--space-4);border-radius:var(--radius-md);background:var(--surface-000);border:1px solid var(--line);font-size:14px}
.layers div b{font-weight:600} .layers div span{color:var(--ink-muted)}
.layers div.sut{background:var(--code-bg);color:var(--code-ink);border-color:var(--code-bg)} .layers div.sut span{color:var(--code-muted)}
.pipeline{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px;overflow-x:auto}
.pipeline div{background:var(--surface-000);border:1px solid var(--line);border-radius:var(--radius-md);padding:var(--space-3);font-size:13px;line-height:19px;min-width:120px}
.pipeline div b{display:block;font:600 12px/16px var(--font-mono);color:var(--brand);margin-bottom:4px;letter-spacing:.02em}
.sources{font-size:14px;line-height:22px;color:var(--ink-muted);border-top:1px solid var(--line);padding-top:var(--space-4);display:flex;flex-direction:column;gap:var(--space-2)}
.sources ul{margin:0;padding-left:18px}

/* quiz */
.quiz{background:var(--surface-000);border:1px solid var(--line);border-radius:var(--radius-lg);padding:var(--space-6);display:flex;flex-direction:column;gap:var(--space-6)}
.q{display:flex;flex-direction:column;gap:var(--space-3)}
.q__text{font-weight:600;margin:0}
.q__opts{display:flex;flex-direction:column;gap:6px}
.opt{display:flex;gap:var(--space-3);align-items:flex-start;text-align:left;width:100%;padding:var(--space-3) var(--space-4);border:1px solid var(--line-strong);border-radius:var(--radius-md);background:var(--surface-000);cursor:pointer;font-size:15px;line-height:22px}
.opt:hover:not([disabled]){background:var(--surface-200)}
.opt .k{font:600 12px/22px var(--font-mono);color:var(--ink-muted);min-width:14px}
.opt[disabled]{cursor:default}
.opt.is-right{background:var(--pass-soft);border-color:var(--pass)} .opt.is-right .k{color:var(--pass)}
.opt.is-wrong{background:var(--fail-soft);border-color:var(--fail)} .opt.is-wrong .k{color:var(--fail)}
.q__why{font-size:14px;line-height:22px;color:var(--ink);background:var(--surface-200);border-radius:var(--radius-md);padding:var(--space-3) var(--space-4);margin:0}
.done-row{display:flex;justify-content:space-between;align-items:center;gap:var(--space-4);flex-wrap:wrap;border-top:1px solid var(--line);padding-top:var(--space-6)}
.pager{display:flex;justify-content:space-between;gap:var(--space-4);flex-wrap:wrap}
.pager a{flex:1;min-width:200px}
.pager a.next{text-align:right;align-items:flex-end}

/* flashcards */
.fc-wrap{display:flex;flex-direction:column;gap:var(--space-4);align-items:stretch;max-width:620px}
.fc__pic{width:88px;height:88px;color:var(--brand);flex:none}
.fc__pic--sm{width:48px;height:48px}
.fc{perspective:1200px;height:340px;cursor:pointer;border:0;padding:0;background:none;width:100%}
.fc__inner{position:relative;width:100%;height:100%;transition:transform .4s;transform-style:preserve-3d}
.fc.flipped .fc__inner{transform:rotateY(180deg)}
.fc__face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:var(--radius-lg);display:flex;flex-direction:column;justify-content:center;align-items:center;gap:var(--space-3);padding:var(--space-8);text-align:center;border:1px solid var(--line);background:var(--surface-000);box-shadow:var(--shadow-raised)}
.fc__face--back{transform:rotateY(180deg);background:var(--brand-soft);border-color:transparent}
.fc__term{font-size:28px;line-height:34px;font-weight:600}
.fc__def{font-size:17px;line-height:27px;max-width:480px}
.fc-ctrl{display:flex;justify-content:space-between;align-items:center;gap:var(--space-2);flex-wrap:wrap}
.chips{display:flex;gap:var(--space-2);flex-wrap:wrap}
.chip{font:600 13px/18px var(--font-sans);padding:6px var(--space-3);border-radius:var(--radius-pill);border:1px solid var(--line-strong);background:var(--surface-000);cursor:pointer;color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}

/* picker */
.pk{display:flex;flex-direction:column;gap:var(--space-6)}
.pk fieldset{border:1px solid var(--line);border-radius:var(--radius-lg);background:var(--surface-000);padding:var(--space-4) var(--space-6) var(--space-6);margin:0;display:flex;flex-direction:column;gap:var(--space-2)}
.pk legend{font-weight:600;padding:0 var(--space-2);margin-left:calc(var(--space-2) * -1)}
.pk label{display:flex;gap:var(--space-3);align-items:flex-start;font-size:15px;line-height:22px;cursor:pointer;padding:6px 0}
.pk input[type=radio]{accent-color:var(--brand);margin-top:4px;width:16px;height:16px;flex:none}
.pk-res{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--space-4)}
.pk-res .card.top{border-color:var(--brand);box-shadow:0 0 0 1px var(--brand)}
.meter{height:8px;background:var(--surface-200);border-radius:var(--radius-pill);overflow:hidden}
.meter span{display:block;height:100%;background:var(--brand);border-radius:var(--radius-pill)}
.pk-res ul{margin:0;padding-left:18px;font-size:14px;line-height:21px;color:var(--ink-muted)}
.empty{color:var(--ink-muted);font-size:15px}


/* exams */
.exambar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;gap:var(--space-4);flex-wrap:wrap;background:var(--surface-000);border:1px solid var(--line);border-radius:var(--radius-lg);padding:var(--space-3) var(--space-4);box-shadow:var(--shadow-raised)}
.exambar__title{display:flex;flex-direction:column;gap:2px;min-width:140px}
.exambar__bar{flex:1;min-width:120px}
.timer{font-size:22px;line-height:28px;font-weight:500;padding:var(--space-1) var(--space-3);border-radius:var(--radius-md);background:var(--surface-200)}
.timer.is-low{background:var(--fail-soft);color:var(--fail)}
.exam-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:var(--space-4)}
.exq{background:var(--surface-000);border:1px solid var(--line);border-radius:var(--radius-lg);padding:var(--space-4) var(--space-6);scroll-margin-top:96px}
.exq.is-flagged{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.exq__head{display:flex;justify-content:space-between;align-items:center;gap:var(--space-2);flex-wrap:wrap}
.opt.is-picked{background:var(--brand-soft);border-color:var(--brand)} .opt.is-picked .k{color:var(--brand)}
div.opt{cursor:default}
.result{display:flex;justify-content:space-between;align-items:flex-end;gap:var(--space-4);flex-wrap:wrap;background:var(--surface-000);border:1px solid var(--line);border-radius:var(--radius-lg);padding:var(--space-6)}
.result__score b{display:block;font-size:56px;line-height:60px;font-weight:500}
.result__score b span{font-size:24px;color:var(--ink-muted)}
.result__score>span{color:var(--ink-muted);font-size:14px}
.result__verdict{display:flex;flex-direction:column;align-items:flex-end;gap:var(--space-2)}
.result__verdict .badge{font-size:14px;padding:6px 12px}
.bytrack{display:flex;flex-direction:column;gap:var(--space-3);background:var(--surface-000);border:1px solid var(--line);border-radius:var(--radius-lg);padding:var(--space-4) var(--space-6)}
.bytrack__row{display:grid;grid-template-columns:180px minmax(0,1fr) 56px 76px;gap:var(--space-3);align-items:center;font-size:14px}
@media (max-width:900px){.exambar{top:calc(env(safe-area-inset-top,0px) + 58px);gap:var(--space-2) var(--space-3);padding:var(--space-2) var(--space-3)}.exambar__title{min-width:0}.exq{scroll-margin-top:170px}}
@media (max-width:520px){.bytrack__row{grid-template-columns:minmax(0,1fr) 48px 70px}.bytrack__row .meter{grid-column:1/-1;grid-row:2}.exq{padding:var(--space-4)}.result__verdict{align-items:flex-start}.timer{font-size:18px}}

@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;inset:0 auto 0 0;width:min(320px,86vw);z-index:20;transform:translateX(-102%);transition:transform .2s;padding-top:calc(var(--space-6) + env(safe-area-inset-top,0px))}
  .app.nav-open .side{transform:none;box-shadow:0 0 0 100vmax rgba(0,0,0,.35)}
  .topbar{display:flex;position:sticky;top:env(safe-area-inset-top,0px);z-index:10;justify-content:space-between;align-items:center;gap:var(--space-3);padding:var(--space-3) var(--space-4);background:var(--surface-200);border-bottom:1px solid var(--line)}
  .topbar .bar{flex:1;max-width:140px}
  main{padding-inline:var(--space-4);padding-block:var(--space-8)}
  .hero{grid-template-columns:minmax(0,1fr)}
  .hero h1{font-size:38px;line-height:42px}
  .mod-head h1{font-size:30px;line-height:36px}
  .pk-res{grid-template-columns:minmax(0,1fr)}
  .pipeline{grid-template-columns:repeat(3,minmax(0,1fr))}
}
@media (max-width:520px){
  .stats{grid-template-columns:minmax(0,1fr)}
  .stat{display:flex;justify-content:space-between;align-items:baseline}
  .pipeline{grid-template-columns:repeat(2,minmax(0,1fr))}
  .pipeline div{min-width:0}
  .card{padding:var(--space-4)}
  .quiz{padding:var(--space-4)}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
