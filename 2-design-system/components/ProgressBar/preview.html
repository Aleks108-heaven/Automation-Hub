<!doctype html>
<html><head><meta charset="utf-8"><title>ProgressBar — preview</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>body{margin:0;padding:16px;background:var(--surface-100);font-family:var(--font-sans);color:var(--ink)}</style></head>
<body class="ah-root">
<div style="display:flex;flex-direction:column;gap:14px;max-width:520px">
<div style="display:flex;justify-content:space-between"><span class="ah-label">Your progress</span><span style="font:400 13px var(--font-mono)">7 / 22</span></div>
<div class="ah-progress ah-progress--bordered"><span style="width:32%"></span></div>
<div class="ah-meter ah-meter--pass"><span style="width:80%"></span></div>
<div class="ah-meter ah-meter--fail"><span style="width:40%"></span></div></div>
</body></html>
